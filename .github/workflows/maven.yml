# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Ensure user settings.xml exists
      # Takari's MavenJUnitTestRunner-based Mojo integration tests require
      # a resolvable user settings.xml. Create an empty one so the takari
      # testProperties goal writes the `user.settings` path into test.properties.
      run: |
        mkdir -p ~/.m2
        if [ ! -f ~/.m2/settings.xml ]; then
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"' \
            '    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"' \
            '    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd"/>' \
            > ~/.m2/settings.xml
        fi
    - name: Build and verify with Maven
      # Use `verify` so the Mojo integration tests under takari-plugin-integration-testing
      # actually run (they are bound to post-test phases). Skip GPG signing — the
      # workflow does not provide signing keys.
      run: mvn -B -s ~/.m2/settings.xml -Dgpg.skip=true verify --file pom.xml
